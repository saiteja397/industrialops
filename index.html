 #edf0f3}td{font-size:12px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcfd}.cell-strong{font-weight:700}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:750}.badge.submitted,.badge.resolved,.badge.closed{background:#e8f6ef;color:#14764f}.badge.draft,.badge.open,.badge.investigating{background:#fff3dc;color:#8b5c12}.badge.review,.badge.in-progress{background:#eaf1ff;color:#315eaa}.badge.high,.badge.critical{background:#fdeaea;color:#a82f36}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:11px;font-weight:750;color:#53616e}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;border:1px solid #dbe1e7;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink);min-width:0}.filters input,.filters select{width:auto;min-width:150px}.field textarea{resize:vertical;min-height:78px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}.form-card{padding:22px;max-width:900px}.form-section{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;border-bottom:1px solid var(--line);padding-bottom:9px;margin:7px 0 1px;grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.empty{padding:38px 18px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.notice{padding:12px 14px;border-radius:10px;background:#eef5ff;color:#315d96;border:1px solid #d9e7ff;font-size:12px;margin-bottom:16px}.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-card{padding:20px}.settings-card h3{margin:0 0 5px;font-size:15px}.settings-card p{color:var(--muted);font-size:12px;margin:0 0 17px}.setting-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border:0}.setting-name{font-weight:700;font-size:12px}.setting-note{font-size:11px;color:var(--muted);margin-top:3px}.toast{position:fixed;bottom:22px;right:22px;background:#15232e;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 10px 35px #14222c33;z-index:20;max-width:340px}.modal-back{position:fixed;inset:0;background:#10182080;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:15px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:21px}.mobile-menu{display:none}.footer-note{font-size:11px;color:var(--muted);margin-top:17px}.file-label{display:inline-flex}.file-label input{display:none}
@media(max-width:1050px){.app{grid-template-columns:210px minmax(0,1fr)}.content{padding:24px 22px}.topbar{padding:0 22px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid,.bottom-grid{grid-template-columns:1fr}}

<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">IO</div><div><div class="brand-name">IndustrialOps</div><div class="brand-sub">Factory workspace</div></div></div>
<div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span>Overview</button><button data-page="reports"><span class="ico">▤</span>Shift reports</button><button data-page="incidents"><span class="ico">⚑</span>Incidents</button><button data-page="analytics"><span class="ico">▥</span>Analytics</button></nav></div>
<div><div class="nav-label">ADMINISTRATION</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings</button><button data-page="audit"><span class="ico">◷</span>Audit history</button></nav></div>
<div class="side-bottom"><div><span class="status-dot"></span>Prototype running locally</div><div style="margin-top:8px">IndustrialOps v0.1 · Demo mode</div></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button><div><div class="crumb">IndustrialOps / <span id="crumb">Overview</span></div><div class="top-title" id="topTitle">Manufacturing overview</div></div></div><div class="top-right"><span class="demo-pill">● DEMO DATA</span><div class="avatar" title="Demo administrator">AD</div></div></header><section class="content" id="content"></section></main></div><div id="overlay"></div><div id="toast" class="toast" hidden></div>
<script>
(()=>{'use strict';
const KEY='industrialops_v01_state';
const today=new Date();const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const offsetDate=n=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const seed=()=>({settings:{lines:[{id:'L1',name:'Laser Cell 01',target:1200},{id:'L2',name:'Weld Line 02',target:950},{id:'L3',name:'Assembly 03',target:780}],shifts:['Early','Late','Night'],site:'Demo Manufacturing Plant'},reports:[
{id:'SR-1048',date:offsetDate(0),shift:'Early',lineId:'L1',target:1200,good:1134,scrap:26,downtime:34,planned:420,status:'Submitted',operator:'Alex Demo',comments:'Minor setup delay at shift start.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'SR-1047',date:offsetDate(0),shift:'Early',lineId:'L2',target:950,good:918,scrap:19,downtime:22,planned:420,status:'In review',operator:'Jamie Sample',comments:'Within normal operating range.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'SR-1046',date:offsetDate(-1),shift:'Late',lineId:'L1',target:1200,good:1172,scrap:18,downtime:17,planned:420,status:'Submitted',operator:'Alex Demo',comments:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'SR-1045',date:offsetDate(-1),shift:'Night',lineId:'L3',target:780,good:724,scrap:31,downtime:61,planned:420,status:'Draft',operator:'Morgan Example',comments:'Downtime investigated by maintenance.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'SR-1044',date:offsetDate(-2),shift:'Early',lineId:'L2',target:950,good:936,scrap:12,downtime:14,planned:420,status:'Submitted',operator:'Jamie Sample',comments:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'SR-1043',date:offsetDate(-2),shift:'Late',lineId:'L1',target:1200,good:1094,scrap:35,downtime:49,planned:420,status:'Submitted',operator:'Alex Demo',comments:'Tool change took longer than planned.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'SR-1042',date:offsetDate(-3),shift:'Early',lineId:'L3',target:780,good:751,scrap:16,downtime:27,planned:420,status:'Submitted',operator:'Morgan Example',comments:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'SR-1041',date:offsetDate(-3),shift:'Night',lineId:'L2',target:950,good:889,scrap:29,downtime:58,planned:420,status:'In review',operator:'Jamie Sample',comments:'Short stop frequency increased.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}
],incidents:[
{id:'INC-203',date:offsetDate(0),title:'Scrap rate above target',lineId:'L2',category:'Quality',severity:'High',owner:'Jamie Sample',due:offsetDate(1),status:'Investigating',description:'Scrap rate exceeded the local target during the early shift.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'INC-202',date:offsetDate(-1),title:'Unplanned laser cell stop',lineId:'L1',category:'Downtime',severity:'Medium',owner:'Alex Demo',due:offsetDate(0),status:'Open',description:'Stop recorded during setup. Cause needs confirmation.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},
{id:'INC-201',date:offsetDate(-2),title:'Sensor bracket adjusted',lineId:'L3',category:'Maintenance',severity:'Low',owner:'Morgan Example',due:offsetDate(-1),status:'Resolved',description:'Bracket aligned and checked during the shift.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}
],audit:[{id:1,time:new Date().toISOString(),actor:'System',action:'Demo workspace initialized',entity:'Workspace',detail:'Synthetic example data created.'}]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){state=seed()}let page='dashboard',reportEdit=null,incidentEdit=null,toastTimer=null;
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString();const lineName=id=>state.settings.lines.find(x=>x.id===id)?.name||'Unknown line';const line=id=>state.settings.lines.find(x=>x.id===id);const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;const sum=(arr,k)=>arr.reduce((s,x)=>s+Number(x[k]||0),0);const sortedReports=()=>[...state.reports].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Browser storage is full. Export your data before continuing.');}}
function log(action,entity,detail){state.audit.unshift({id:Date.now()+Math.random(),time:new Date().toISOString(),actor:'Demo Administrator',action,entity,detail});save()}
function notify(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3000)}
function nav(p){page=p;reportEdit=null;incidentEdit=null;$('#sidebar').classList.remove('open');render()}
const pageInfo={dashboard:['Overview','Manufacturing overview'],reports:['Shift reports','Production reporting'],incidents:['Incidents','Incident register'],analytics:['Analytics','Production analytics'],settings:['Settings','Workspace configuration'],audit:['Audit history','Record activity']};
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=pageInfo[page][0];$('#topTitle').textContent=pageInfo[page][1];const c=$('#content');if(page==='dashboard')c.innerHTML=dashboard();else if(page==='reports')c.innerHTML=reportsPage();else if(page==='incidents')c.innerHTML=incidentsPage();else if(page==='analytics')c.innerHTML=analyticsPage();else if(page==='settings')c.innerHTML=settingsPage();else c.innerHTML=auditPage();bindPage();}
function reportTable(rows,limit){if(!rows.length)return '<div class="empty"><strong>No reports found</strong>Try changing your filters or create a new shift report.</div>';return `<div class="table-wrap"><table><thead><tr><th>Report</th><th>Date / shift</th><th>Production line</th><th>Good parts</th><th>Scrap</th><th>Achievement</th><th>Status</th><th></th></tr></thead><tbody>${(limit?rows.slice(0,limit):rows).map(r=>`<tr><td class="cell-strong">${esc(r.id)}</td><td>${esc(r.date)}<div class="muted">${esc(r.shift)}</div></td><td>${esc(lineName(r.lineId))}</td><td>${money(r.good)}</td><td>${money(r.scrap)}</td><td>${pct(r.good,r.target)}%</td><td><span class="badge ${statusClass(r.status)}">${esc(r.status)}</span></td><td><button class="btn small" data-edit-report="${esc(r.id)}">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function statusClass(s){return String(s).toLowerCase().replace(/\s+/g,'-')}
function dashboard(){const rs=state.reports.filter(r=>r.date===offsetDate(0));const good=sum(rs,'good'),target=sum(rs,'target'),scrap=sum(rs,'scrap'),down=sum(rs,'downtime'),planned=sum(rs,'planned');const open=state.incidents.filter(i=>i.status!=='Resolved'&&i.status!=='Closed').length;const achievement=pct(good,target);const lineRows=state.settings.lines.map(l=>{const rr=rs.filter(r=>r.lineId===l.id);const g=sum(rr,'good'),t=sum(rr,'target');return `<div class="line-row"><div><div class="line-name">${esc(l.name)}</div><div class="line-meta">${money(g)} / ${money(t||l.target)} good parts</div><div class="progress"><span style="width:${Math.min(100,pct(g,t||l.target))}%"></span></div></div><div class="line-val">${pct(g,t||l.target)}%</div></div>`}).join('');const last7=Array.from({length:7},(_,i)=>offsetDate(i-6));const daily=last7.map(d=>{let rr=state.reports.filter(r=>r.date===d);return {d,label:new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'}),good:sum(rr,'good'),target:sum(rr,'target')}});const max=Math.max(1,...daily.flatMap(x=>[x.good,x.target]));return `<div class="page-head"><div><div class="eyebrow">${esc(state.settings.site)} · ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1 class="h1">Good ${greeting()}, team.</h1><p class="sub">Here's your production snapshot. Track the shift, spot exceptions and keep your team aligned.</p></div><div class="actions"><button class="btn" data-action="export">↧ Export data</button><button class="btn primary" data-action="new-report">＋ New shift report</button></div></div>
<div class="grid kpis"><div class="card kpi"><div class="kpi-top">Good parts today <span class="kpi-icon">▤</span></div><div class="kpi-val">${money(good)}</div><div class="kpi-foot"><span class="${achievement>=100?'positive':'negative'}">${achievement}%</span> of today's recorded target</div></div><div class="card kpi"><div class="kpi-top">Scrap rate <span class="kpi-icon">⌁</span></div><div class="kpi-val">${pct(scrap,good+scrap)}<span style="font-size:15px">%</span></div><div class="kpi-foot">${money(scrap)} scrap parts recorded today</div></div><div class="card kpi"><div class="kpi-top">Downtime <span class="kpi-icon">◷</span></div><div class="kpi-val">${down}<span style="font-size:15px"> min</span></div><div class="kpi-foot">${pct(down,planned)}% of planned production time</div></div><div class="card kpi"><div class="kpi-top">Open incidents <span class="kpi-icon">⚑</span></div><div class="kpi-val">${open}</div><div class="kpi-foot">${state.incidents.filter(i=>i.severity==='High'||i.severity==='Critical').filter(i=>i.status!=='Resolved'&&i.status!=='Closed').length} high-priority items need attention</div></div></div>
<div class="grid dashboard-grid"><div class="card"><div class="card-head"><div><div class="card-title">Output trend</div><div class="card-desc">Good parts vs. target · last 7 days</div></div><span class="badge review">Daily</span></div><div class="card-body"><div class="chart">${daily.map(x=>`<div class="chart-col"><div class="bars"><div class="bar" style="height:${x.target?Math.max(2,x.target/max*100):2}%" data-v="Target ${money(x.target)}"></div><div class="bar actual" style="height:${x.good?Math.max(2,x.good/max*100):2}%" data-v="Actual ${money(x.good)}"></div></div><div class="chart-label">${x.label}</div></div>`).join('')}</div><div class="legend"><span><i style="background:#cbd6e0"></i>Target</span><span><i style="background:var(--accent)"></i>Actual good parts</span></div></div></div><div class="card"><div class="card-head"><div><div class="card-title">Line performance</div><div class="card-desc">Today's recorded output by line</div></div><button class="btn small" data-nav="analytics">Details ↗</button></div><div class="card-body"><div class="line-list">${lineRows||'<div class="empty">No lines configured.</div>'}</div></div></div></div>
<div class="grid bottom-grid"><div class="card"><div class="card-head"><div><div class="card-title">Recent shift reports</div><div class="card-desc">Latest production records</div></div><button class="btn small" data-nav="reports">View all ↗</button></div>${reportTable(sortedReports(),5)}</div><div class="card"><div class="card-head"><div><div class="card-title">Needs attention</div><div class="card-desc">Unresolved incidents</div></div><button class="btn small" data-nav="incidents">View all ↗</button></div><div class="card-body">${state.incidents.filter(i=>i.status!=='Resolved'&&i.status!=='Closed').slice(0,4).map(i=>`<div class="line-row"><div><div class="line-name">${esc(i.title)}</div><div class="line-meta">${esc(lineName(i.lineId))} · Due ${esc(i.due||'—')}</div></div><span class="badge ${i.severity==='High'||i.severity==='Critical'?'high':'open'}">${esc(i.severity)}</span></div>`).join('')||'<div class="empty"><strong>All clear</strong>No open incidents.</div>'}</div></div></div><div class="footer-note">Prototype data is stored in this browser only. Do not use for real production records.</div>`}
function greeting(){let h=new Date().getHours();return h<12?'morning':h<18?'afternoon':'evening'}
function reportsPage(){return `<div class="page-head"><div><div class="eyebrow">Production data</div><h1 class="h1">Shift reports</h1><p class="sub">Capture shift performance in one consistent, searchable register.</p></div><div class="actions"><label class="btn file-label">↥ Import CSV<input type="file" id="importFile" accept=".csv,text/csv"></label><button class="btn" data-action="export">↧ Export CSV</button><button class="btn primary" data-action="new-report">＋ New report</button></div></div><div class="notice">Demo workspace: reports are saved to this browser's local storage. Use synthetic data only.</div><div class="filters"><input id="reportSearch" placeholder="Search report or line…" aria-label="Search reports"><select id="reportLine"><option value="">All production lines</option>${state.settings.lines.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select><select id="reportStatus"><option value="">All statuses</option><option>Draft</option><option>In review</option><option>Submitted</option></select><input type="date" id="reportDate" aria-label="Filter by date"></div><div class="card" id="reportTable">${reportTable(sortedReports())}</div><div class="footer-note">Tip: use a consistent shift/line/date key to prevent duplicate entries during a real migration.</div>`}
function incidentsPage(){return `<div class="page-head"><div><div class="eyebrow">Exceptions & follow-up</div><h1 class="h1">Incident register</h1><p class="sub">Track production interruptions, quality concerns and actions through to resolution.</p></div><div class="actions"><button class="btn primary" data-action="new-incident">＋ Log incident</button></div></div><div class="filters"><input id="incidentSearch" placeholder="Search incidents…" aria-label="Search incidents"><select id="incidentStatus"><option value="">All statuses</option><option>Open</option><option>Investigating</option><option>In progress</option><option>Resolved</option><option>Closed</option></select><select id="incidentSeverity"><option value="">All severities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class="card" id="incidentTable">${incidentTable([...state.incidents])}</div><div class="footer-note">This is a lightweight issue register, not a validated 8D or regulated CAPA system.</div>`}
function incidentTable(rows){if(!rows.length)return '<div class="empty"><strong>No incidents found</strong>Try different filters or log a new incident.</div>';return `<div class="table-wrap"><table><thead><tr><th>Incident</th><th>Reported</th><th>Line</th><th>Category</th><th>Severity</th><th>Owner</th><th>Due date</th><th>Status</th><th></th></tr></thead><tbody>${rows.sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<tr><td class="cell-strong">${esc(i.title)}<div class="muted">${esc(i.id)}</div></td><td>${esc(i.date)}</td><td>${esc(lineName(i.lineId))}</td><td>${esc(i.category)}</td><td><span class="badge ${['High','Critical'].includes(i.severity)?'high':i.severity==='Low'?'resolved':'open'}">${esc(i.severity)}</span></td><td>${esc(i.owner||'Unassigned')}</td><td>${esc(i.due||'—')}</td><td><span class="badge ${statusClass(i.status)}">${esc(i.status)}</span></td><td><button class="btn small" data-edit-incident="${esc(i.id)}">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function analyticsPage(){const rs=sortedReports();const totalGood=sum(rs,'good'),totalScrap=sum(rs,'scrap'),totalTarget=sum(rs,'target'),totalDown=sum(rs,'downtime'),totalPlanned=sum(rs,'planned');const rows=state.settings.lines.map(l=>{const rr=rs.filter(r=>r.lineId===l.id);const g=sum(rr,'good'),s=sum(rr,'scrap'),t=sum(rr,'target'),d=sum(rr,'downtime');return `<tr><td class="cell-strong">${esc(l.name)}</td><td>${rr.length}</td><td>${money(g)}</td><td>${money(t)}</td><td>${pct(g,t)}%</td><td>${pct(s,g+s)}%</td><td>${d} min</td></tr>`}).join('');return `<div class="page-head"><div><div class="eyebrow">Performance intelligence</div><h1 class="h1">Analytics</h1><p class="sub">A transparent summary calculated from the current set of shift reports.</p></div><div class="actions"><button class="btn" data-action="export">↧ Export data</button></div></div><div class="grid kpis"><div class="card kpi"><div class="kpi-top">Total good parts <span class="kpi-icon">▤</span></div><div class="kpi-val">${money(totalGood)}</div><div class="kpi-foot">Across ${rs.length} reports</div></div><div class="card kpi"><div class="kpi-top">Target achievement <span class="kpi-icon">◎</span></div><div class="kpi-val">${pct(totalGood,totalTarget)}%</div><div class="kpi-foot">Good parts / recorded target</div></div><div class="card kpi"><div class="kpi-top">Overall scrap rate <span class="kpi-icon">⌁</span></div><div class="kpi-val">${pct(totalScrap,totalGood+totalScrap)}%</div><div class="kpi-foot">${money(totalScrap)} scrap parts</div></div><div class="card kpi"><div class="kpi-top">Downtime rate <span class="kpi-icon">◷</span></div><div class="kpi-val">${pct(totalDown,totalPlanned)}%</div><div class="kpi-foot">${totalDown} / ${totalPlanned} planned minutes</div></div></div><div class="card"><div class="card-head"><div><div class="card-title">Production line summary</div><div class="card-desc">All stored demo and user-created reports</div></div></div><div class="table-wrap"><table><thead><tr><th>Production line</th><th>Reports</th><th>Good parts</th><th>Target</th><th>Achievement</th><th>Scrap rate</th><th>Downtime</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No data yet.</td></tr>'}</tbody></table></div></div><div class="notice" style="margin-top:16px">Metric definitions: target achievement = good parts ÷ target; scrap rate = scrap ÷ (good + scrap); downtime rate = downtime minutes ÷ planned production minutes. Validate these definitions with each factory before operational use.</div>`}
function settingsPage(){return `<div class="page-head"><div><div class="eyebrow">Workspace administration</div><h1 class="h1">Settings</h1><p class="sub">Configure the demo site, production lines, shift names and target quantities.</p></div><div class="actions"><button class="btn" data-action="reset">↺ Reset demo</button></div></div><div class="grid settings-grid"><div class="card settings-card"><h3>Workspace details</h3><p>Set the name shown on the dashboard.</p><form id="siteForm"><div class="field"><label for="siteName">Site / company display name</label><input id="siteName" value="${esc(state.settings.site)}" required maxlength="90"></div><div class="form-actions"><button class="btn primary">Save details</button></div></form></div><div class="card settings-card"><h3>Production lines & targets</h3><p>Targets are used when creating a new shift report.</p><div>${state.settings.lines.map(l=>`<div class="setting-row"><div><div class="setting-name">${esc(l.name)}</div><div class="setting-note">Target: ${money(l.target)} parts / shift</div></div><button class="btn small" data-edit-line="${esc(l.id)}">Edit</button></div>`).join('')}</div><form id="lineForm" style="margin-top:16px"><div class="form-grid"><div class="field"><label for="lineName">New line name</label><input id="lineName" placeholder="e.g. Press Line 04" required maxlength="70"></div><div class="field"><label for="lineTarget">Target / shift</label><input id="lineTarget" type="number" min="1" step="1" value="800" required></div></div><div class="form-actions"><button class="btn primary">＋ Add production line</button></div></form></div><div class="card settings-card"><h3>Shift definitions</h3><p>Manage shift names shown in report entry.</p><div id="shiftList">${state.settings.shifts.map((s,i)=>`<div class="setting-row"><div class="setting-name">${esc(s)}</div><button class="btn small danger" data-remove-shift="${i}">Remove</button></div>`).join('')}</div><form id="shiftForm" style="margin-top:15px"><div class="field"><label for="shiftName">Add shift</label><input id="shiftName" placeholder="e.g. Weekend" required maxlength="40"></div><div class="form-actions"><button class="btn">＋ Add shift</button></div></form></div><div class="card settings-card"><h3>Data & prototype</h3><p>Manage the records stored in this browser.</p><div class="setting-row"><div><div class="setting-name">Export full backup</div><div class="setting-note">Download reports, incidents, settings and audit history as JSON.</div></div><button class="btn small" data-action="backup">Export JSON</button></div><div class="setting-row"><div><div class="setting-name">Clear local data</div><div class="setting-note">Reset this browser to synthetic example records.</div></div><button class="btn small danger" data-action="reset">Reset</button></div><div class="notice" style="margin-top:15px;margin-bottom:0">Browser local storage is not a shared database or secure production store. Export backups before clearing browser data.</div></div></div>`}
function auditPage(){const rows=state.audit||[];return `<div class="page-head"><div><div class="eyebrow">Traceability</div><h1 class="h1">Audit history</h1><p class="sub">Review recent actions captured by this prototype.</p></div><div class="actions"><button class="btn" data-action="backup">↧ Export backup</button></div></div><div class="notice">Prototype limitation: browser-local audit entries can be changed by someone with access to the browser or developer tools. A production audit trail must be enforced server-side.</div><div class="card"><div class="table-wrap"><table><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${esc(new Date(a.time).toLocaleString())}</td><td>${esc(a.actor)}</td><td class="cell-strong">${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="5">No events recorded.</td></tr>'}</tbody></table></div></div>`}
function reportForm(r){const isEdit=!!r;const x=r||{date:offsetDate(0),shift:state.settings.shifts[0]||'Early',lineId:state.settings.lines[0]?.id||'',target:state.settings.lines[0]?.target||0,good:'',scrap:0,downtime:0,planned:420,status:'Draft',operator:'Demo Operator',comments:''};return `<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><div><h2>${isEdit?'Edit shift report':'New shift report'}</h2><div class="card-desc">${isEdit?esc(x.id):'Record one production line and shift'}</div></div><button class="btn small" data-action="close-modal" aria-label="Close">✕</button></div><div class="modal-body"><form id="reportForm" data-id="${esc(x.id||'')}"><div class="form-grid"><div class="form-section">Shift details</div><div class="field"><label for="rDate">Production date *</label><input id="rDate" type="date" required value="${esc(x.date)}"></div><div class="field"><label for="rShift">Shift *</label><select id="rShift" required>${state.settings.shifts.map(s=>`<option ${s===x.shift?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field full"><label for="rLine">Production line *</label><select id="rLine" required>${state.settings.lines.map(l=>`<option value="${esc(l.id)}" ${l.id===x.lineId?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="form-section">Production metrics</div><div class="field"><label for="rTarget">Target quantity *</label><input id="rTarget" type="number" min="1" step="1" required value="${esc(x.target)}"></div><div class="field"><label for="rGood">Good parts *</label><input id="rGood" type="number" min="0" step="1" required value="${esc(x.good)}"></div><div class="field"><label for="rScrap">Scrap parts *</label><input id="rScrap" type="number" min="0" step="1" required value="${esc(x.scrap)}"></div><div class="field"><label for="rDown">Downtime (minutes) *</label><input id="rDown" type="number" min="0" step="1" required value="${esc(x.downtime)}"></div><div class="field"><label for="rPlanned">Planned production (minutes) *</label><input id="rPlanned" type="number" min="1" step="1" required value="${esc(x.planned)}"></div><div class="field"><label for="rOperator">Operator / reporter *</label><input id="rOperator" required maxlength="90" value="${esc(x.operator)}"></div><div class="field"><label for="rStatus">Status</label><select id="rStatus"><option ${x.status==='Draft'?'selected':''}>Draft</option><option ${x.status==='In review'?'selected':''}>In review</option><option ${x.status==='Submitted'?'selected':''}>Submitted</option></select></div><div class="field full"><label for="rComments">Shift comments</label><textarea id="rComments" maxlength="1200" placeholder="Explain significant stops, deviations or handover notes…">${esc(x.comments)}</textarea></div></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">${isEdit?'Save changes':'Save shift report'}</button></div></form></div></div></div>`}
function incidentForm(i){const x=i||{date:offsetDate(0),title:'',lineId:state.settings.lines[0]?.id||'',category:'Quality',severity:'Medium',owner:'',due:offsetDate(1),status:'Open',description:''};return `<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><div><h2>${i?'Edit incident':'Log incident'}</h2><div class="card-desc">Record an issue for investigation and follow-up</div></div><button class="btn small" data-action="close-modal">✕</button></div><div class="modal-body"><form id="incidentForm" data-id="${esc(x.id||'')}"><div class="form-grid"><div class="field full"><label for="iTitle">Incident title *</label><input id="iTitle" required maxlength="140" value="${esc(x.title)}"></div><div class="field"><label for="iDate">Reported date *</label><input id="iDate" type="date" required value="${esc(x.date)}"></div><div class="field"><label for="iLine">Production line *</label><select id="iLine" required>${state.settings.lines.map(l=>`<option value="${esc(l.id)}" ${l.id===x.lineId?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label for="iCategory">Category</label><select id="iCategory">${['Quality','Downtime','Safety','Maintenance','Delivery','Other'].map(s=>`<option ${s===x.category?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="iSeverity">Severity</label><select id="iSeverity">${['Low','Medium','High','Critical'].map(s=>`<option ${s===x.severity?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="iOwner">Owner</label><input id="iOwner" maxlength="90" value="${esc(x.owner)}" placeholder="Person responsible"></div><div class="field"><label for="iDue">Due date</label><input id="iDue" type="date" value="${esc(x.due)}"></div><div class="field"><label for="iStatus">Status</label><select id="iStatus">${['Open','Investigating','In progress','Resolved','Closed'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label for="iDescription">Description *</label><textarea id="iDescription" required maxlength="2000">${esc(x.description)}</textarea></div></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Save incident</button></div></form></div></div></div>`}
function openReport(id){reportEdit=id?state.reports.find(r=>r.id===id):null;$('#overlay').innerHTML=reportForm(reportEdit);bindModal()}
function openIncident(id){incidentEdit=id?state.incidents.find(r=>r.id===id):null;$('#overlay').innerHTML=incidentForm(incidentEdit);bindModal()}
function closeModal(){$('#overlay').innerHTML='';reportEdit=null;incidentEdit=null}
function bindModal(){const back=$('#modalBack');back.addEventListener('click',e=>{if(e.target===back)closeModal()});back.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.addEventListener('click',closeModal));const lf=$('#rLine');if(lf)lf.addEventListener('change',()=>{if(!reportEdit){const l=line(lf.value);if(l)$('#rTarget').value=l.target}});const rf=$('#reportForm');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();const val=id=>$('#'+id).value;const obj={date:val('rDate'),shift:val('rShift'),lineId:val('rLine'),target:+val('rTarget'),good:+val('rGood'),scrap:+val('rScrap'),downtime:+val('rDown'),planned:+val('rPlanned'),operator:val('rOperator').trim(),status:val('rStatus'),comments:val('rComments').trim()};if(Object.values({target:obj.target,good:obj.good,scrap:obj.scrap,downtime:obj.downtime,planned:obj.planned}).some(n=>!Number.isFinite(n)||n<0)||obj.target<1||obj.planned<1){notify('Check numeric fields. Target and planned time must be greater than zero.');return}if(obj.good+obj.scrap>obj.target*10){if(!confirm('Good + scrap quantity is more than 10× target. Save anyway?'))return}const duplicate=state.reports.find(r=>r.id!==(reportEdit?.id)&&r.date===obj.date&&r.shift===obj.shift&&r.lineId===obj.lineId);if(duplicate&&!confirm(`A report (${duplicate.id}) already exists for this line/date/shift. Save a duplicate anyway?`))return;const now=new Date().toISOString();if(reportEdit){Object.assign(reportEdit,obj,{updatedAt:now});log('Updated shift report','Shift report',`${reportEdit.id} · ${obj.date} · ${lineName(obj.lineId)}`);notify('Shift report updated.')}else{obj.id='SR-'+String(Math.max(1040,...state.reports.map(r=>parseInt(r.id.replace(/\D/g,''))||0)+1));obj.createdAt=now;obj.updatedAt=now;state.reports.push(obj);log('Created shift report','Shift report',`${obj.id} · ${obj.date} · ${lineName(obj.lineId)}`);notify('Shift report saved.')}save();closeModal();render()});const inf=$('#incidentForm');if(inf)inf.addEventListener('submit',e=>{e.preventDefault();const val=id=>$('#'+id).value;const obj={date:val('iDate'),title:val('iTitle').trim(),lineId:val('iLine'),category:val('iCategory'),severity:val('iSeverity'),owner:val('iOwner').trim(),due:val('iDue'),status:val('iStatus'),description:val('iDescription').trim()};const now=new Date().toISOString();if(incidentEdit){Object.assign(incidentEdit,obj,{updatedAt:now});log('Updated incident','Incident',`${incidentEdit.id} · ${obj.title}`);notify('Incident updated.')}else{obj.id='INC-'+String(Math.max(200,...state.incidents.map(i=>parseInt(i.id.replace(/\D/g,''))||0)+1));obj.createdAt=now;obj.updatedAt=now;state.incidents.push(obj);log('Created incident','Incident',`${obj.id} · ${obj.title}`);notify('Incident saved.')}save();closeModal();render()})}
function bindPage(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));document.querySelectorAll('[data-edit-report]').forEach(b=>b.addEventListener('click',()=>openReport(b.dataset.editReport)));document.querySelectorAll('[data-edit-incident]').forEach(b=>b.addEventListener('click',()=>openIncident(b.dataset.editIncident)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));if($('#reportSearch'))['reportSearch','reportLine','reportStatus','reportDate'].forEach(id=>$('#'+id).addEventListener('input',filterReports));if($('#incidentSearch'))['incidentSearch','incidentStatus','incidentSeverity'].forEach(id=>$('#'+id).addEventListener('input',filterIncidents));if($('#importFile'))$('#importFile').addEventListener('change',importCSV);if($('#siteForm'))$('#siteForm').addEventListener('submit',e=>{e.preventDefault();state.settings.site=$('#siteName').value.trim();log('Updated workspace settings','Settings',`Site name changed to ${state.settings.site}`);save();notify('Workspace details saved.');render()});if($('#lineForm'))$('#lineForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#lineName').value.trim(),target=Number($('#lineTarget').value);if(!name||!Number.isInteger(target)||target<1)return;if(state.settings.lines.some(l=>l.name.toLowerCase()===name.toLowerCase())){notify('A line with that name already exists.');return}const id='L'+(Math.max(0,...state.settings.lines.map(l=>parseInt(l.id.replace(/\D/g,''))||0))+1);state.settings.lines.push({id,name,target});log('Added production line','Production line',`${name} · target ${target}`);save();notify('Production line added.');render()});if($('#shiftForm'))$('#shiftForm').addEventListener('submit',e=>{e.preventDefault();const s=$('#shiftName').value.trim();if(!s)return;if(state.settings.shifts.some(x=>x.toLowerCase()===s.toLowerCase())){notify('That shift already exists.');return}state.settings.shifts.push(s);log('Added shift definition','Settings',s);save();render();notify('Shift added.')});document.querySelectorAll('[data-remove-shift]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.removeShift,s=state.settings.shifts[i];if(state.reports.some(r=>r.shift===s)){notify('This shift is used by existing reports and cannot be removed.');return}if(confirm(`Remove shift “${s}”?`)){state.settings.shifts.splice(i,1);log('Removed shift definition','Settings',s);save();render()}}));document.querySelectorAll('[data-edit-line]').forEach(b=>b.addEventListener('click',()=>editLine(b.dataset.editLine)))}
function filterReports(){const q=$('#reportSearch').value.toLowerCase(),ln=$('#reportLine').value,st=$('#reportStatus').value,dt=$('#reportDate').value;const rows=sortedReports().filter(r=>(!q||`${r.id} ${lineName(r.lineId)} ${r.operator} ${r.comments}`.toLowerCase().includes(q))&&(!ln||r.lineId===ln)&&(!st||r.status===st)&&(!dt||r.date===dt));$('#reportTable').innerHTML=reportTable(rows)}
function filterIncidents(){const q=$('#incidentSearch').value.toLowerCase(),st=$('#incidentStatus').value,sv=$('#incidentSeverity').value;const rows=state.incidents.filter(i=>(!q||`${i.id} ${i.title} ${lineName(i.lineId)} ${i.owner} ${i.description}`.toLowerCase().includes(q))&&(!st||i.status===st)&&(!sv||i.severity===sv));$('#incidentTable').innerHTML=incidentTable(rows);$('#incidentTable').querySelectorAll('[data-edit-incident]').forEach(b=>b.addEventListener('click',()=>openIncident(b.dataset.editIncident)))}
function action(a){if(a==='new-report')openReport();else if(a==='new-incident')openIncident();else if(a==='close-modal')closeModal();else if(a==='export')exportCSV();else if(a==='backup')backupJSON();else if(a==='reset'){if(confirm('Reset this browser workspace to the original synthetic demo data? Your locally created records will be lost.')){state=seed();save();render();notify('Demo data reset.')}}}
function editLine(id){const l=line(id);if(!l)return;const name=prompt('Production line name:',l.name);if(name===null)return;const target=prompt('Target quantity per shift:',String(l.target));if(target===null)return;const n=Number(target);if(!name.trim()||!Number.isInteger(n)||n<1){notify('Enter a valid name and positive whole-number target.');return}const old=l.name;l.name=name.trim();l.target=n;log('Updated production line','Production line',`${old} → ${l.name}; target ${n}`);save();render();notify('Production line updated.')}
function csvEscape(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const fields=['id','date','shift','lineId','lineName','target','good','scrap','downtime','planned','status','operator','comments','createdAt','updatedAt'];const rows=[fields.join(','),...sortedReports().map(r=>fields.map(k=>csvEscape(k==='lineName'?lineName(r.lineId):r[k])).join(','))];download('industrialops-shift-reports.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');log('Exported shift reports','Export',`${state.reports.length} report(s)`);save();notify('CSV export downloaded.')}
function backupJSON(){download('industrialops-backup.json',JSON.stringify(state,null,2),'application/json');log('Exported JSON backup','Export','Workspace backup downloaded.');save();notify('JSON backup downloaded.')}
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));if(row.some(v=>v!==''))rows.push(row);row=[];field=''}else field+=c}if(field.length||row.length){row.push(field.replace(/\r$/,''));if(row.some(v=>v!==''))rows.push(row)}return rows}
function importCSV(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const rows=parseCSV(String(reader.result).replace(/^\ufeff/,''));if(rows.length<2)throw Error('No data rows found.');const heads=rows[0].map(x=>x.trim().toLowerCase());const idx=k=>heads.indexOf(k);const required=['date','shift','lineid','target','good','scrap','downtime'];const missing=required.filter(k=>idx(k)<0);if(missing.length)throw Error('Missing required columns: '+missing.join(', '));let added=0,skipped=0;for(const row of rows.slice(1)){const get=k=>idx(k)<0?'':(row[idx(k)]||'').trim();const ln=state.settings.lines.find(l=>l.id===get('lineid'))||state.settings.lines.find(l=>l.name.toLowerCase()===get('linename').toLowerCase());const n=k=>Number(get(k));if(!get('date')||!get('shift')||!ln||!Number.isFinite(n('target'))||n('target')<1||!['good','scrap','downtime'].every(k=>get(k)!==''&&Number.isFinite(n(k))&&n(k)>=0)){skipped++;continue}if(state.reports.some(r=>r.date===get('date')&&r.shift===get('shift')&&r.lineId===ln.id)){skipped++;continue}const id=get('id')&&!state.reports.some(r=>r.id===get('id'))?get('id'):'SR-IMP-'+Date.now().toString().slice(-7)+'-'+(added+1);const now=new Date().toISOString();state.reports.push({id,date:get('date'),shift:get('shift'),lineId:ln.id,target:n('target'),good:n('good'),scrap:n('scrap'),downtime:n('downtime'),planned:get('planned')&&n('planned')>0?n('planned'):420,status:get('status')||'Submitted',operator:get('operator')||'CSV Import',comments:get('comments'),createdAt:now,updatedAt:now});added++}log('Imported shift reports','Import',`${added} imported; ${skipped} skipped`);save();render();notify(`Import complete: ${added} added, ${skipped} skipped. Review the register.`)}catch(err){alert('CSV import failed: '+err.message)}e.target.value=''};reader.readAsText(file)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
})();
</script></body></html>
